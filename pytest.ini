[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short --ignore=__init__.py --ignore=voxcpm_nodes.py --ignore=voxcpm_train_nodes.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
